# Cross-platform, micromamba-free base environment for running the pipeline
# core locally (Windows/Linux/macOS). Two steps, from the repo root:
#
#   conda env create -f env/environment_local.yml
#   conda activate align_local
#   pip install -e ".[dev]"     # installs the pipeline + deps from pyproject.toml
#
# Dependencies live in pyproject.toml (single source of truth); this file only
# provides the base interpreter. The cluster/micromamba install
# (install_pipeline.sh + conda-lock) is unchanged.
name: align_local
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
