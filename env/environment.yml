name: align
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pyyaml
  - seaborn
  - statsmodels
  - plotly
  - ipykernel
  - polars
  - pyarrow
  - bottleneck
  - numcodecs
  - pip

  # development dependencies
  - pytest
  - black
  - isort
  - conda-lock
  - pre-commit
  - mypy
  - flake8
  - tox

  - pip:
    - torch<2.8
    - torchvision
    - bioio
    - bioio-nd2
    - bioio-ome-tiff
    - bioio-ome-zarr
    - crc32c # missing dependency for bioio-ome-tiff
    - microfilm
    - align_toolbox
    - shiny
    - shinywidgets
    - statannotations
    - tensorboard
    - bayesian-optimization
    - cellpose
