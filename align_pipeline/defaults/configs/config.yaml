# Can be overridden with the --experiment_dir CLI flag.
experiment_dir: "/mnt/towbin.data/shared/spsalmon/pipeline_test_folder/"
analysis_dir_name: "analysis"

# Temp files default to ./temp_files. Override with the --temp_dir CLI flag or
# an explicit temp_dir key here.
# temp_dir: "/path/to/temp_files"

# Delete this run's temp dir + the empty sbatch_output landing zone once the
# pipeline finishes (the backup keeps a full copy). Default false.
# cleanup_on_success: false

raw_dir_name: "raw"
report_format: "parquet"
pixelsize: [ 0.65 ]

# When an annotated filemap exists, use it instead of the plain one.
overwrite_annotated_filemap: False

get_experiment_time: True

# Regexes keep single quotes so the backslashes don't need escaping.
time_regex: 'Time(\d+)'
point_regex: 'Point(\d+)'

# Compute parallelism for the workers (all backends): joblib --n_jobs.
n_jobs: 32

# Execution backend: "slurm" (default, submits cluster jobs) or "local" (runs
# in-process, no slurm/micromamba).
# backend: "slurm"

# SLURM resources for the cluster backend are kept in a separate file, merged
# in at startup (only when backend is slurm). Path is relative to this file.
slurm_config: "slurm_config.yaml"

# The command that launches python everywhere: the worker jobs and (via
# run_pipeline.sh) the outer slurm job. Defaults to the active interpreter
# (local) or the micromamba runner (slurm).
# python_command: "conda run -n align python"

#########################################################################################################
################################# IMAGE ANALYSIS PIPELINE CONFIGURATION #################################
#########################################################################################################

building_blocks:
  - "segmentation"
  - "segmentation"
  - "straightening"
  - "straightening"
  - "straightening"
  - "straightening"
  - "morphology_computation"
  - "morphology_computation"
  - "fluorescence_quantification"
  - "quality_control"
  - "quality_control"
  - "molt_detection"

rerun_segmentation: [ False ]
rerun_straightening: [ False ]
rerun_morphology_computation: [ False ]
rerun_fluorescence_quantification: [ False ]
rerun_quality_control: [ False ]
rerun_molt_detection: [ False ]

# Folder references below name a directory produced under the analysis dir; the
# analysis_dir_name prefix is optional (e.g. "ch2_seg" == "analysis/ch2_seg").
# "raw" is the raw input; an absolute path is used as-is.

# segmentation parameters
segmentation_column: [ "raw" ]
segmentation_name_suffix: [ null ]
segmentation_method: [ "deep_learning" ]
segmentation_channels: [ [ 1 ], [ 0 ] ]


# deep learning segmentation parameters
model_path: [ "/mnt/towbin.data/shared/spsalmon/towbinlab_segmentation_database/models/paper/body/towbintools_medium/best_light.ckpt", "/mnt/towbin.data/shared/spsalmon/towbinlab_segmentation_database/models/paper/pharynx/towbintools_medium/best_light.ckpt" ]
batch_size: [ 4 ]

# Folder references below name a directory produced under the analysis dir; the
# analysis_dir_name prefix is optional (e.g. "ch2_seg" == "analysis/ch2_seg").
# "raw" is the raw input; an absolute path is used as-is.

# straightening parameters
straightening_source: [ [ "ch2_seg", null ], [ "ch1_seg", null ], [ "raw", [ 1 ] ], [ "raw", [ 0 ] ] ]
straightening_masks: [ "ch2_seg", "ch1_seg", "ch2_seg", "ch1_seg" ]

# morphology computation parameters
morphology_computation_masks: [ "ch2_seg_str", "ch1_seg_str" ]
morphological_features: [ [ "length", "area", "volume", "width_mean" ] ]

# quality control parameters
qc_masks: [ "ch2_seg_str", "ch1_seg_str" ]
qc_images: [ [ "ch2_raw_str", null ], [ "ch1_raw_str", null ] ]
qc_model_path: [ "/mnt/towbin.data/shared/spsalmon/towbinlab_classification_database/models/10x_body_qc/qc_xgb_model.pkl", "/mnt/towbin.data/shared/spsalmon/towbinlab_classification_database/models/10x_pharynx_qc/qc_xgb_model.pkl" ]
qc_import_eggs_from: [ null, "ch2_seg_str_qc" ]

# molt detection parameters
molt_detection_method: [ "deep_learning" ]
# molt_detection_model_path defaults to the bundled model; set it to override.
molt_detection_columns: [ [ "ch2_seg_str_volume" ] ]

# fluo quantification parameters
fluorescence_quantification_source: [ [ "raw", 0 ] ]
fluorescence_quantification_masks: [ "ch2_seg" ]
fluorescence_quantification_aggregations: [ [ "sum", "std", "mean" ] ]
fluorescence_background_aggregation: [ "median" ]
