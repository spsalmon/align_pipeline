# SLURM resource requests. Merged into the main config at startup when backend
# is "slurm" (see init_pipeline). Keeping the cluster knobs here means a new
# cluster is adjusted in one place. Any sbatch_* key set directly in the main
# config takes precedence over this file.
#
# The top-level sbatch_* keys below are the shared DEFAULT applied to every
# worker block. Optionally override per block type under sbatch_overrides, and
# set the outer/orchestrator job's resources under sbatch_init.
sbatch_memory: 64G
sbatch_time: 0-48:00:00
sbatch_cpus: 32
sbatch_gpus: "rtx6000:1"

# Extra raw sbatch options for cluster-specific needs. Each entry is rendered
# verbatim as a `#SBATCH <entry>` line, so any directive works. A standard key
# above can be omitted to replace it (e.g. drop sbatch_memory and request
# memory per cpu here instead).
# Put cluster-wide invariants here: the sections below ADD to this list rather
# than replacing it, so an entry set here always applies (but cannot be dropped
# by a section either).
# sbatch_extra_options:
#   - "--account=gratis"
#   - "--mem-per-cpu=4G"

# Per-block-type overrides, merged over the defaults above (only list what
# differs). Keyed by block name (segmentation, straightening, ...). Scalar keys
# replace the default; sbatch_extra_options entries are appended to it.
# sbatch_overrides:
#   segmentation:
#     sbatch_gpus: "rtx6000:1"
#     sbatch_memory: 32G
#     sbatch_extra_options:
#       - "--partition=gpu"
#   morphology_computation:
#     sbatch_gpus: null
#     sbatch_cpus: 8

# The outer/orchestrator job (runs init_pipeline, submits the first block),
# merged over the defaults above (it never gets a GPU). A throttle limiting how
# many pipelines run at once belongs here.
# sbatch_init:
#   sbatch_cpus: 4
#   sbatch_memory: 8G
#   sbatch_time: 0-12:00:00
#   sbatch_extra_options:
#     - "--gres=pipelinecapacity:1"
