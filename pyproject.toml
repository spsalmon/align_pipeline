# Packaging for the pipeline core: makes the repo pip-installable
# (`pip install -e .`) so it runs from any cwd, declares the core runtime
# dependencies, and exposes the `towbintools-pipeline` command.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "towbintools_pipeline"
version = "0.1.0"
description = "Configurable image-analysis pipeline built on towbintools."
requires-python = ">=3.11"
dependencies = [
    "towbintools>=0.4.3",  # 0.4.3+ has the current molt-detection model architecture
    "numpy",
    "polars",
    "pyarrow",
    "joblib",
    "tifffile",
    "pyyaml",
    "lxml",
    "tqdm",  # used directly; not pulled in by towbintools
    # Imported directly by the pipeline but typically pulled in transitively by
    # towbintools; declared explicitly so a change in its requirements cannot
    # silently drop them from under the pipeline.
    "opencv-contrib-python",
    "pandas",
    "scipy",
    "torch",
    "xgboost",
]

[project.optional-dependencies]
dev = ["pytest"]
# Optional segmentation backend, imported lazily. Kept out of the core so a
# default install does not pull opencv-python-headless over opencv-contrib.
cellpose = ["cellpose==4.2.1.1"]

[project.scripts]
# Subcommand dispatcher: `towbintools-pipeline run|init-configs`. With no known
# subcommand it forwards to `run`, so `towbintools-pipeline -c config.yaml` and
# `python -m towbintools_pipeline.init_pipeline` both still work.
# `tt-pipeline` and `ttp` are shorter aliases for the same command.
towbintools-pipeline = "towbintools_pipeline.cli:main"
tt-pipeline = "towbintools_pipeline.cli:main"
ttp = "towbintools_pipeline.cli:main"

[tool.setuptools]
# The pipeline core and its workers; gui/ and training/ are not part of it.
packages = ["towbintools_pipeline", "towbintools_pipeline.workers"]

[tool.setuptools.package-data]
# Ship the bundled example configs and default models with the package.
towbintools_pipeline = ["defaults/**/*.yaml", "defaults/**/*.ckpt", "defaults/**/*.json"]

[tool.black]
# pin the target so black's AST safety check does not depend on the
# interpreter that happens to run the hook
target-version = ["py310"]

[tool.isort]
# keep isort's output identical to what black would produce, otherwise the
# two hooks rewrite each other on every commit
profile = "black"
line_length = 88
