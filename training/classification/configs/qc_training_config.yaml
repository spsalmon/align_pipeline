# Directory produced by the labelling/annotation tool. Must contain:
#   project.yaml, images/, masks/, annotations/annotations.csv
# Either a single directory, or a list of directories to combine into one
# training set (features are cached per dataset), e.g.
# dataset_path:
#   - "/path/to/first_dataset/"
#   - "/path/to/second_dataset/"
dataset_path:
  - "/mnt/towbin.data/shared/spsalmon/towbinlab_classification_database/datasets/10x_body_qc/body/"

# Directory where the trained model bundle and classifiers are written.
output_path: "/mnt/towbin.data/shared/spsalmon/towbinlab_classification_database/models/new/10x_body_qc_super_strict_mask_only/"

# Output file names written inside output_path.
model_name: "qc_xgb_model.pkl"
qc_classifier_name: "qc_xgb_model.json"
egg_classifier_name: "egg_xgb_model.json"

optimize_hyperparameters: true
mask_only: true
train_egg_detector: true

pixelsizes: {'squid': 0.864, 'ti2': 0.65}

rerun_feature_extraction: true

# hyperparameter optimization settings
n_points: 10
n_iter: 50

# Fraction of samples held out for validation, and the split seed.
test_split_ratio: 0.2
random_state: 42
